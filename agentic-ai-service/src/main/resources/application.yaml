server:
  port: 8000

spring:
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5:7b
          temperature: 0.2
    mcp:
      client:
        enabled: true
        name: agentic-ai-client
        version: 1.0.0
        type: SYNC # Set to SYNC so Spring creates SyncMcpToolCallbackProvider
        sse:
          connections:
            # Connection 4: Product Microservice
            product-service:
              url: http://localhost:8081
              sse-endpoint: /sse #/mcp/sse

