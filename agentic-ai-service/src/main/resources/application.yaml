server:
  port: 8000

spring:
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5:7b
          temperature: 0.2
          num-ctx: 8192
    mcp:
      client:
        enabled: true
        name: agentic-ai-client
        version: 1.0.0
        request-timeout: 60s
        type: SYNC
        sse:
          connections:
            product-service:
              url: http://localhost:8081
              sse-endpoint: /sse   # Changed from /mcp/sse to /sse