server:
  port: 8086

spring:
  application:
    name: search-service

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: search-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.use.type.headers: true # <-- CRITICAL: Tells consumer to rely ONLY on JSON payload's 'eventType'
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.ecommerce.app.event.BaseProductEvent

  elasticsearch:
    uris: http://localhost:29200
    socket-timeout: 30s
    connection-timeout: 5s

app:
  kafka:
    topics:
      product-events: product-events-topic

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}