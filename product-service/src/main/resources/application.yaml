server:
  port: 8081

spring:
  ai:
    mcp:
      server:
        annotation-scanner:
          enabled: true
        enabled: true
        name: product-service-mcp
        version: 1.0.0
        protocol: SSE
        sse-endpoint: /mcp/sse         # Overrides default /sse to /mcp/sse
        sse-message-endpoint: /mcp/message
        webmvc:
          enabled: true

  application:
    name: product-catalog-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3307/ecommerce_db?useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:appuser}
    password: ${MYSQL_PASSWORD:apppassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: Redis@123
      timeout: 5s

      lettuce:
        pool:
          enabled: true
          max-active: 50
          max-idle: 20
          min-idle: 5
          max-wait: 2s
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true

  flyway:
    enabled: true
    table: flyway_schema_history_product
    baseline-on-migrate: true
    baseline-version: 0

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  # otlp:
  #   tracing:
  #     endpoint: http://${OTEL_COLLECTOR:localhost}:4318/v1/traces

app:
  kafka:
    topics:
      product-events: product-events-topic

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}
